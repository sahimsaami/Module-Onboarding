<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="This form allows customers to order a t-shirt by choosing size and colour." />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
      <fieldset> 
    <legend>Customer Information</legend>
    <label for="name">Full Name:</label>
    <input type="text" id="name" minlength="2" required />
    <label for="email">Email:</label>
    <input type="email" id="email" required />
      </fielset> 
        
      <fieldset>
        <legend>T-shirt Colors</legend>
        <label>
          <input type="radio" name="color" value="red" required /> Red
          <input type="radio" name="color" value="blue" required /> Blue
          <input type="radio" name="color" value="black" required/> Black
        </label>
      </fieldset>
      <fieldset>
        <legend>Size</legend>
    <label><input type="radio" name="size" value="XS" required /> XS</label>
    <label><input type="radio" name="size" value="S" required /> S</label>
    <label><input type="radio" name="size" value="M" required /> M</label>
    <label><input type="radio" name="size" value="L" required /> L</label>
    <label><input type="radio" name="size" value="XL" required /> XL</label>
    <label><input type="radio" name="size" value="XXL" required /> XXL</label>
      </fieldset>
      <button type="submit">Submit</button> 
      </form>
    </main>
    <footer>
      <!-- change to your name-->
      <h2>By SAHIM SAAMI</h2>
    </footer>
  </body>
</html>
